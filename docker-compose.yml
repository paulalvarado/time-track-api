name: time-track

services:
  db:
    image: postgres:16-alpine
    container_name: time-track-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timetrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timetrack_secret}
      POSTGRES_DB: ${POSTGRES_DB:-timetrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timetrack} -d ${POSTGRES_DB:-timetrack}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    image: time-track-api:dev
    container_name: time-track-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-timetrack}:${POSTGRES_PASSWORD:-timetrack_secret}@db:5432/${POSTGRES_DB:-timetrack}
      - NODE_ENV=development
    command: ["sh", "-c", "npm run migrate:up && npm run dev"]
    volumes:
      # Hot-reload: monta el código fuente local sin necesidad de rebuild
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./prisma:/app/prisma
      - ./tsconfig.json:/app/tsconfig.json
      - ./package.json:/app/package.json
    depends_on:
      db:
        condition: service_healthy

  sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    image: time-track-api:dev
    container_name: time-track-sync
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-timetrack}:${POSTGRES_PASSWORD:-timetrack_secret}@db:5432/${POSTGRES_DB:-timetrack}
      - NODE_ENV=development
    command: ["sh", "-c", "while true; do npx tsx src/commands/syncworker.ts; echo '[SyncWorker] Waiting 5 min until next run...'; sleep 300; done"]
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./tsconfig.json:/app/tsconfig.json
      - ./package.json:/app/package.json
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

name: time-track

services:
  db:
    image: postgres:16-alpine
    container_name: time-track-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timetrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timetrack_secret}
      POSTGRES_DB: ${POSTGRES_DB:-timetrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timetrack} -d ${POSTGRES_DB:-timetrack}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: time-track-api:php
    container_name: time-track-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:80"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-timetrack}:${POSTGRES_PASSWORD:-timetrack_secret}@db:5432/${POSTGRES_DB:-timetrack}
      - CI_ENVIRONMENT=development
    volumes:
      - ./app:/app/app
      - ./public:/app/public
      - ./writable:/app/writable
      - .env:/app/.env
      - vendor_data:/app/vendor
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  vendor_data:
